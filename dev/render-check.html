<!doctype html>
<meta charset="utf-8">
<title>render-check</title>
<style>
  body { margin:0; background:#111; color:#d1ccc5; font:12px/1.55 monospace; display:flex; gap:14px; padding:12px; }
  #frame-wrap { width:412px; height:915px; flex:0 0 auto; border:1px solid #333; }
  iframe { width:412px; height:915px; border:0; display:block; }
  #out { flex:1 1 auto; white-space:pre-wrap; margin:0; }
  .ok { color:#98e456 } .bad { color:#ed5a6b } .warn { color:#e69419 } .h { color:#edc174 }
</style>
<div id="frame-wrap"><iframe id="game" src="/game-frame.html"></iframe></div>
<pre id="out">запускаю…</pre>
<script>
// ═══════════════════════════════════════════════════════════════════════════
//  render-check — does the client actually draw?
// ═══════════════════════════════════════════════════════════════════════════
//
// The real index.html, the real concatenated bundle, the real render loop.
// Only socket.io and Telegram are stubbed (see dev/render-check.js). This page
// fakes a floor, a character and every kind of thing the world layer knows how
// to draw, drives the real update()/render() pair, and reports what the GPU
// was actually handed.
//
// It exists because no other detector in dev/ can see the screen. A duplicate
// top-level `let` between two bundled files once shipped a blank page to every
// player; the bundle parsed fine on the server, and nothing ever ran it.
//
// Note on how the world is injected: the client is one script scope, and its
// state (player, dungeon, camera, ...) is declared with `let`, which lives in
// the global LEXICAL environment and is therefore not reachable as a property
// of the frame's window. Only function declarations are. So setup runs as a
// <script> appended into the frame — same scope as the game itself — and hands
// its findings back through an ordinary window property.
const out = document.getElementById('out');
const lines = [];
let failed = 0, passed = 0;
const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;');
const say  = (s, cls) => { lines.push(cls ? '<span class="' + cls + '">' + esc(s) + '</span>' : esc(s)); out.innerHTML = lines.join('\n'); };
const head = s => say('\n── ' + s + ' ──', 'h');
const ok   = (cond, label, extra) => {
  if (cond) { passed++; say('  PASS  ' + label + (extra ? '   ' + extra : ''), 'ok'); }
  else { failed++; say('  FAIL  ' + label + (extra ? '   ' + extra : ''), 'bad'); }
};

const fr = document.getElementById('game');
fr.addEventListener('load', () => setTimeout(run, 1200));

function inject(w, code) {
  const sc = w.document.createElement('script');
  sc.textContent = code;
  w.document.body.appendChild(sc);
  sc.remove();
}
// Frames are driven directly rather than through requestAnimationFrame.
// rAF is a vsync callback: a browser that is not compositing the page — a
// background tab, a headless run, a pane that is not on screen — never fires
// it, and the harness would sit there forever reporting nothing. Calling
// update()/render() is the same code path the loop calls, minus the wait, and
// it makes the timing below a measurement of the work instead of a
// measurement of the monitor.
function frames(w, n, ms) {
  return new Promise(res => {
    inject(w, 'window.__rcFrameMs = (function(){' +
      'var t0 = performance.now();' +
      'for (var i = 0; i < ' + n + '; i++) { var ts = performance.now(); update(1/60, 1/60); render(1/60, ts); }' +
      'return (performance.now() - t0) / ' + n + ';' +
    '})();');
    setTimeout(res, ms || 0);
  });
}

// The black-screen watchdog. Each way a world can be blank is reproduced
// here and _worldBlankWhy() has to name it — because the failure players
// actually report ("интерфейс есть, экран чёрный") is invisible to a
// liveness check: a renderer with an empty world draws sixty black frames a
// second and looks perfectly healthy.
const BLANK_PROBE = `window.__rcBlank = (function () {
  var out = {};
  var savedDungeon = dungeon, savedW = W, savedH = H;
  render(1 / 60, performance.now());
  out.healthy = _worldBlankWhy();

  W = 0; H = 0;
  out.zeroViewport = _worldBlankWhy();
  W = savedW; H = savedH;

  dungeon = null;
  out.noMap = _worldBlankWhy();
  dungeon = savedDungeon;

  var keep = [];
  _chunkSprCache.forEach(function (v, k) { keep.push([k, v]); });
  _chunkSprCache.clear();
  out.noTiles = _worldBlankWhy();
  keep.forEach(function (kv) { _chunkSprCache.set(kv[0], kv[1]); });

  render(1 / 60, performance.now());
  out.healthyAgain = _worldBlankWhy();
  out.facts = _worldFacts();
  return out;
})();`;
// Chunk streaming: the lookahead builds chunks the camera has not reached
// yet and keeps them hidden. PixiJS skips hidden sprites entirely, and a
// texture is only uploaded the first time something draws it — so their
// textures used to land on the GPU in the frame they were revealed, which is
// the frame the lookahead existed to protect.
//
// Only chunks built DURING the walk count. Counting every hidden sprite does
// not work and looks like it does: most hidden chunks are ones the camera
// has already passed, and those were uploaded while they were on screen, so
// the check passed happily with the fix taken back out.
const TILE_MARK = `window.__rcKeysBefore = Array.from(_chunkSprCache.keys());`;
const TILE_PROBE = `window.__rcTiles = (function () {
  var uid = _pixiApp.renderer.CONTEXT_UID;
  var before = new Set(window.__rcKeysBefore || []);
  var fresh = 0, freshHidden = 0, uploaded = 0;
  _chunkSprCache.forEach(function (spr, key) {
    if (before.has(key)) return;
    fresh++;
    if (spr.visible) return;
    freshHidden++;
    if (spr.texture.baseTexture._glTextures[uid]) uploaded++;
  });
  return { total: _chunkSprCache.size, fresh: fresh, freshHidden: freshHidden, uploaded: uploaded };
})();`;

// Composite the WebGL world and the 2D HUD overlay into one PNG and send it
// to the server. Injected so it runs in the SAME task as the render() call
// it makes: without preserveDrawingBuffer the WebGL drawing buffer is gone
// the moment the browser composites, so reading it a tick later comes back
// blank. "It drew something" and "it drew the right thing" are different
// claims, and only one of them is answerable by an assertion.
const SHOT = `(function () {
  var world = document.getElementById("canvas");
  var hud   = document.getElementById("ui-canvas");
  render(1 / 60, performance.now());
  var out = document.createElement("canvas");
  out.width = world.width; out.height = world.height;
  var c = out.getContext("2d");
  c.drawImage(world, 0, 0, out.width, out.height);
  if (hud) c.drawImage(hud, 0, 0, out.width, out.height);
  var x = new XMLHttpRequest();
  x.open("POST", "/shot", true);
  x.send(out.toDataURL("image/png"));
})();`;

// Load the REAL map of the real hub, through the client's own loader.
//
// A synthetic grid proves the renderer runs; it does not prove it runs on the
// world players actually load. The tile builder reads rooms, arm entries,
// race/guild/farm bounds and the biome theme straight off the dungeon — and a
// black screen on a real device was traced to that pass failing, with the
// synthetic floor passing happily all along.
// The payload's shape is fixed by Room.mapPayload: a little-endian uint32
// length, that many bytes of JSON metadata, then the packed grid bits. Decoded
// here rather than through the client's own _decodeWorldMap, which is closure
// state inside netConnect and unreachable from outside — see the note above
// about script-scope bindings.
const MAP_LOAD = `window.__rcMapReady = false;
fetch('/api/world-map/hub/x')
  .then(function (r) { return r.arrayBuffer(); })
  .then(function (b) {
    var n = new DataView(b).getUint32(0, true);
    var meta = JSON.parse(new TextDecoder().decode(new Uint8Array(b, 4, n)));
    meta.gridPacked = new Uint8Array(b, 4 + n);
    window.__rcMap = meta;
    window.__rcMapReady = true;
  })
  .catch(function (e) { window.__rcMapErr = String(e && e.message); window.__rcMapReady = true; });`;

// Everything below runs INSIDE the game's own script scope.
const SETUP = `
(function () {
  const T = TILE;
  const m = window.__rcMap;
  window.__rcRealMap = !!m;
  if (m) {
    // Exactly what _applyGameStart does with it, so the tile pass sees the
    // same object shape it sees in play.
    dungeonLvl = 1;
    dungeon = { ...m, grid: unpackGrid(m.gridPacked, m.w, m.h), enemies: [], safeZone: m.safeZone || null };
    if (typeof _buildArmGates === 'function') _buildArmGates();
    if (typeof initNpcs === 'function') initNpcs();
  } else {
    const TW = 70, TH = 70;
    const grid = [];
    for (let y = 0; y < TH; y++) {
      const row = new Array(TW);
      for (let x = 0; x < TW; x++) row[x] = (x < 2 || y < 2 || x > TW - 3 || y > TH - 3) ? 0 : 1;
      grid.push(row);
    }
    dungeonLvl = 1;
    dungeon = {
      w: TW, h: TH, grid, spawn: { x: 35 * T, y: 35 * T },
      rooms: [{ x: 2, y: 2, w: TW - 4, h: TH - 4, arm: 'left', monsterLvl: 5 }],
      safeZone: null, armEntries: null, returnPad: null, corridorGates: null,
    };
  }
  const cx = dungeon.spawn.x, cy = dungeon.spawn.y;
  window.__rcCx = cx; window.__rcCy = cy;
  buildTileCanvas();
  player = makePlayer('lev');
  player.x = cx; player.y = cy;
  netUsername = 'render-check';
  state = 'playing';
  activeTab = 0;
  camera.x = cx - 200; camera.y = cy - 300;
  loadSprites('lev');

  // Enemies — entity sprites, HP bars, status tints, selection ring, labels.
  const eids = Object.keys(ENEMY_SPRITE_DEF || {});
  serverEnemies = [];
  for (let i = 0; i < 12; i++) {
    const e = {
      id: 'e' + i, eid: eids[i % eids.length],
      x: cx - 240 + (i % 4) * 150, y: cy - 180 + Math.floor(i / 4) * 130,
      hp: 60 - i * 3, maxHp: 60, size: 18, rlvl: 5 + i, name: 'Монстр ' + i,
      isBoss: i === 0, aggro: i % 2 === 0, _moveTimer: 1, _facing: 'down',
      atkAnimTimer: 0, hurtTimer: i === 3 ? 0.2 : 0,
      slowTimer: i === 5 ? 1 : 0, stunTimer: i === 6 ? 1 : 0,
    };
    serverEnemies.push(e);
    loadEnemySprites(e.eid);
  }
  serverEnemiesMap = new Map(serverEnemies.map(e => [e.id, e]));
  targetId = 'e1'; targetIsPlayer = false;

  // Other players — second entity layer plus the 2D name/clan overlay.
  otherPlayers = new Map();
  ['lev', 'mage', 'ranger'].forEach(function (ty, i) {
    otherPlayers.set('p' + i, {
      x: cx + 120 + i * 70, y: cy + 140, type: ty, facing: 'front',
      hp: 90, maxHp: 100, username: 'Игрок' + i, clanName: 'Клан', clanIcon: 3,
      animFrame: 0, pvpMode: i === 0,
    });
    loadSprites(ty);
  });

  drops = [{ x: cx - 60, y: cy + 60, type: 'gold', life: 1 },
           { x: cx - 20, y: cy + 60, type: 'item', life: 1 }];
  worldDrops = new Map();
  for (let i = 0; i < 40; i++) {
    worldDrops.set('w' + i, { id: 'w' + i,
      x: cx - 300 + (i % 8) * 80, y: cy + 200 + Math.floor(i / 8) * 60,
      item: { rarity: ['common', 'uncommon', 'rare', 'epic', 'legendary'][i % 5] } });
  }
  projs = [{ x: cx + 40, y: cy - 40, vx: 1, vy: 0, size: 6, color: '#fa0', projType: 'arrow', angle: 0 },
           { x: cx + 90, y: cy - 40, vx: 1, vy: 0, size: 7, color: '#4af' }];
  otherProjs = [];
  spawnBurst(cx, cy - 80, '#ff8844', 60);
  spawnBurst(cx + 60, cy - 80, '#66ccff', 60);
  spawnAOE(cx - 120, cy, 70, 'fissure', '#e04040', '#ffaa40');
  spawnAOE(cx + 120, cy, 60, 'frost', '#5ad0ff');
  dmgNum(cx, cy - 40, '1234', '#ff4');
  dmgNum(cx + 30, cy - 60, '⚡ 999', '#ff8c00', 19);
  dmgNum(cx - 30, cy - 60, '+250g', '#ff0');
  dmgNum(cx, cy - 100, '−50% XP (5 мин)', '#c4838a');   // Cyrillic: the fallback path

  // Ground decals: portal, return pad, level gates, both barrier kinds.
  _portalPad = { x: cx - 160, y: cy - 200 };
  _returnPads = [{ x: cx - 60, y: cy - 200 }];
  _armGates = [{ x: cx + 200, y: cy - 200, req: 20, dir: 'left' },
               { x: cx + 200, y: cy - 60,  req: 0,  dir: 'top' }];
  _raceBarriers = [{ x: cx - 260, y: cy - 60, lane: 0, tier: 0 }];
  _coopBarriers = [{ x: cx - 260, y: cy + 60, stage: 5 }];
  _coopStageNo = 0;

  ['login-screen', 'charselect'].forEach(function (id) {
    const el = document.getElementById(id); if (el) el.style.display = 'none';
  });
  const cs = document.querySelector('.cs-stage');
  if (cs && cs.parentElement) cs.parentElement.style.display = 'none';
})();`;

const PROBE = `window.__rc = {
  alive: pixiAlive(), gpu: gpuStats(),
  particles: particles.length, dmg: dmgNums.length,
  decals: _decals.length, decalKinds: _decals.map(function (d) { return d.k; }),
  labels: _decalLbls.length,
  enemies: serverEnemies.length, others: otherPlayers.size, drops: worldDrops.size,
  torches: (typeof _chunkTorches !== 'undefined' && _chunkTorches) ? _chunkTorches.size : -1,
  chunks: (typeof _chunkSprCache !== 'undefined') ? _chunkSprCache.size : -1,
  tileRange: (typeof _tileRangeStr === 'function') ? _tileRangeStr() : '?',
  tileFailed: (typeof pixiTileRange === 'function') ? pixiTileRange().failed : false,
  realMap: !!window.__rcRealMap,
  state: state, hasDungeon: !!dungeon,
  profUpdate: _profUpdate, profRender: _profRender,
};`;

const BURST = `for (let i = 0; i < 6; i++) spawnBurst(__rcCx + i * 30, __rcCy, '#ff8844', 60);`;

async function run() {
  const w = fr.contentWindow;
  out.innerHTML = ''; lines.length = 0;

  head('загрузка');
  ok(typeof w.PIXI === 'object', 'PixiJS загружен', w.PIXI && w.PIXI.VERSION);
  ok(typeof w.pixiInit === 'function', 'бандл выполнился');
  if (typeof w.pixiInit !== 'function') return finish(w);
  ok(w.pixiAlive(), 'рендерер живой (WebGL-контекст есть)');
  ok((w.__rcErrors || []).length === 0, 'ни одной ошибки при старте', (w.__rcErrors || []).slice(0, 3).join(' | '));

  head('мир');
  inject(w, MAP_LOAD);
  for (let i = 0; i < 60 && !w.__rcMapReady; i++) await new Promise(res => setTimeout(res, 50));
  ok(!!w.__rcMap, 'настоящая карта хаба загружена клиентским загрузчиком',
     w.__rcMap ? w.__rcMap.w + 'x' + w.__rcMap.h : ('НЕТ — ' + (w.__rcMapErr || 'таймаут')));
  inject(w, SETUP);
  await frames(w, 12);
  inject(w, PROBE);
  let r = w.__rc;
  ok(r && r.hasDungeon && r.state === 'playing', 'этаж собран и игра в состоянии playing');
  ok(r.chunks > 0, 'тайлы НАСТОЯЩЕЙ карты растеризуются',
     r.chunks + ' чанков; диапазон ' + r.tileRange
     + (r.tileFailed ? '  СБОРКА ЧАНКА УПАЛА' : ''));
  ok(!r.tileFailed, 'ни один чанк не упал при сборке');
  ok(r.torches > 0, 'на карте есть факелы (чанки действительно разобраны)', String(r.torches));

  head('всё, что рисует мир');
  ok(r.gpu.draws > 0, 'кадр дошёл до GPU', r.gpu.draws + ' draw calls, ' + (r.gpu.verts / 1000).toFixed(1) + 'k вершин');
  ok(r.gpu.draws < 60, 'сцена батчится', r.gpu.draws + ' draws на ' + r.enemies + ' мобов + ' + r.others + ' игроков + ' + r.particles + ' частиц + ' + r.drops + ' дропов');
  ok(r.alive, 'рендерер пережил полную сцену');
  ok(r.particles > 0, 'частицы живы', r.particles + ' шт');
  ok(r.dmg > 0, 'цифры урона живы', r.dmg + ' шт');
  ok(r.decals > 0, 'декали на полу собраны', r.decals + ' фигур, ' + r.labels + ' подписей');
  ok(r.decalKinds.indexOf('swirl') >= 0, 'портал (swirl) собран');
  ok(r.decalKinds.indexOf('ring') >= 0, 'кольцевые пады и ворота собраны');
  ok(r.decalKinds.indexOf('wall') >= 0, 'барьеры зон собраны');

  inject(w, SHOT);
  say('  снимок кадра отправлен -> dev/_render-shot.png');

  head('сторож чёрного экрана');
  inject(w, BLANK_PROBE);
  const bl = w.__rcBlank;
  ok(bl.healthy === null, 'на здоровом мире молчит', bl.healthy === null ? '' : 'сказал: ' + bl.healthy);
  ok(bl.zeroViewport === 'zero-viewport', 'ловит нулевой размер экрана (WebView разложил #app в ноль)', String(bl.zeroViewport));
  ok(bl.noMap === 'no-map', 'ловит отсутствие карты (gameStart не доехал)', String(bl.noMap));
  ok(bl.noTiles === 'no-tiles', 'ловит непостроенные тайлы', String(bl.noTiles));
  ok(bl.healthyAgain === null, 'после восстановления снова молчит', String(bl.healthyAgain));
  say('  диагностика: ' + bl.facts);

  head('потоковая подгрузка тайлов');
  // Walk east so the lookahead has a direction to build toward. The keys are
  // recorded first so the probe can tell a fresh lookahead chunk from one the
  // camera has simply left behind.
  inject(w, TILE_MARK);
  // The stick is held east so inputDir() reports a direction and the lookahead
  // has something to aim at, but only render() runs — no update(), so the
  // camera does not actually travel. That is the whole point: the chunks built
  // here are ones the camera has NOT reached, which is the only case that
  // proves anything. Letting the camera move revealed every chunk it built and
  // the check passed with the fix taken back out.
  inject(w, 'joy.active = true; joy.dx = 1; joy.dy = 0;');
  inject(w, 'for (var i = 0; i < 20; i++) render(1/60, performance.now());');
  inject(w, 'joy.active = false; joy.dx = 0; joy.dy = 0;');
  inject(w, TILE_PROBE);
  const tl = w.__rcTiles;
  ok(tl.freshHidden > 0, 'задел вперёд реально строится', tl.fresh + ' новых чанков, из них ещё не показанных: ' + tl.freshHidden);
  ok(tl.freshHidden > 0 && tl.uploaded === tl.freshHidden,
     'текстуры задела УЖЕ на видеокарте, а не в кадре появления',
     tl.uploaded + '/' + tl.freshHidden);

  head('атлас цифр урона');
  const bmp = w.PIXI.BitmapFont.available && w.PIXI.BitmapFont.available['libdmg'];
  ok(!!bmp, 'атлас глифов испечён', bmp ? Object.keys(bmp.chars).length + ' глифов' : 'НЕТ');
  if (bmp) {
    const pages = Object.keys(bmp.pageTextures || {}).length;
    ok(pages === 1, 'одна страница атласа = один draw call на все цифры', pages + ' стр.');
    ok(!!bmp.chars[49] && !!bmp.chars[0x26a1], 'цифры и ⚡ (крит) в атласе');
    ok(!bmp.chars[0x043c], 'кириллицы нет — она уходит в запасной PIXI.Text (так и задумано)');
  }

  head('нагрузка: +360 частиц, 60 кадров подряд');
  inject(w, BURST);
  await frames(w, 60);
  const frameMs = w.__rcFrameMs;
  inject(w, PROBE);
  r = w.__rc;
  say('  update+render: ' + frameMs.toFixed(2) + 'ms на кадр (чистая работа, без ожидания vsync)');
  say('  GPU: ' + r.gpu.draws + ' draw calls, ' + (r.gpu.verts / 1000).toFixed(1) + 'k вершин, частиц ' + r.particles);
  ok(r.gpu.draws > 3 && r.gpu.draws < 60, 'draw calls остались низкими под нагрузкой', String(r.gpu.draws));
  ok(r.gpu.verts > 500 && r.gpu.verts < 6000, 'геометрии кадра мало', (r.gpu.verts / 1000).toFixed(1) + 'k вершин');

  head('цена одного объекта в вершинах');
  // The regression this guards: a pooled sprite is one quad — six indices —
  // while a PixiJS drawCircle is about ninety-four, because Pixi tessellates
  // circles in JavaScript and re-uploads the whole buffer every frame.
  // Particles and ground loot were both circles. Counted per item rather than
  // in aggregate, so the number stays meaningful whatever else is on screen.
  inject(w, 'particles.length = 0; worldDrops.clear();');
  await frames(w, 2);
  inject(w, PROBE); const vBase = w.__rc.gpu.verts;
  inject(w, `spawnBurst(__rcCx, __rcCy, '#ff8844', 100);`);
  await frames(w, 1);
  inject(w, PROBE); const vPart = w.__rc.gpu.verts;
  const perParticle = (vPart - vBase) / w.__rc.particles;
  // Порог 12, а не 6, и это не послабление.
  //
  // Различать надо 6 (спрайт) и ~94 (тесселированный круг) — между ними
  // пятнадцатикратная разница, и 12 отделяет их ровно так же надёжно, как 6.
  // А вот ровно 6 не оставляло места ни одному постороннему спрайту: числитель
  // считает ВСЕ вершины кадра, и если в тот же кадр попадёт число урона или
  // кадр анимации моба — три лишних квада на сотню частиц дают 6.2 и падение
  // на верном коде. Так и было: примерно один прогон из четырёх, ещё до того,
  // как этой вкладки коснулись (проверено повтором на нетронутом HEAD).
  //
  // Набор, который падает раз в четыре запуска, учит не читать его падения.
  ok(perParticle > 0 && perParticle <= 12, 'частица = спрайт, не тесселированный круг',
     perParticle.toFixed(1) + ' верш./частицу (круг был бы ~94)' + (perParticle > 0 ? '' : ' — НИЧЕГО НЕ НАРИСОВАЛОСЬ'));
  inject(w, 'particles.length = 0;');
  inject(w, `for (let i = 0; i < 40; i++) worldDrops.set('d' + i, { id: 'd' + i, x: __rcCx - 200 + (i % 8) * 50, y: __rcCy + 60 + Math.floor(i / 8) * 50, item: { rarity: 'epic' } });`);
  await frames(w, 2);
  inject(w, PROBE); const vDrop = w.__rc.gpu.verts;
  const perDrop = (vDrop - vBase) / 40;
  // Three sprites is eighteen indices; the bound is a little above that
  // because the baseline is measured on a scene with other things in it, and a
  // decal or a name drifting in or out shifts it by a sprite. What is being
  // guarded is the difference between ~18 and ~462, not the last unit.
  ok(perDrop > 0 && perDrop <= 24, 'куча лута = три спрайта, не круг + два скруглённых прямоугольника',
     perDrop.toFixed(1) + ' верш./кучу (было 462)' + (perDrop > 0 ? '' : ' — НИЧЕГО НЕ НАРИСОВАЛОСЬ'));

  // Runs after every measurement above and before the wallet section, because
  // it ends by REBUILDING THE RENDERER — a new canvas element, a new context,
  // every GPU handle dropped. Nothing that counts vertices can survive that.
  await blankWorldChecks(w);

  // LAST, and deliberately so. The wallet section is DOM work that takes a few
  // seconds, and the two vertex-per-object measurements above are differences
  // against a baseline measured on a live scene — a decal or a damage number
  // drifting in or out during those seconds moves the baseline by a sprite,
  // which is the whole budget the particle bound has. Running the wallet
  // checks first made that check flake at 6.2 against a limit of 6.
  await walletChecks(w);

  ok((w.__rcErrors || []).length === 0, 'ни одной ошибки за весь прогон', (w.__rcErrors || []).slice(0, 5).join(' | '));

  finish(w);
}

// ═══════════════════════════════════════════════════════════════════════════
//  The black screen, and what the player is told about it
// ═══════════════════════════════════════════════════════════════════════════
// One real report of this reached the server and could not be acted on:
//
//   no-tiles — экран 360x704 · pixi жив · карта 68x68 эт.1 · чанки 0/0
//            · draws 2 · сокет на связи · кадр 12мс назад
//
// A live renderer, a real map, frames going out — and an EMPTY chunk
// structure. Not "built none of twelve": nothing was ever created to build.
// The four ways that can happen look identical from the outside and have
// nothing in common as fixes, so each one is reproduced here and the
// diagnostic has to name it — and then the recovery has to be seen to fail
// before the player is told anything, because the recoveries usually work.
//
// Everything below drives the client's OWN watchdog, _worldWatchdog(), the
// same function setInterval calls once a second in play. Only the clock is
// faked: _wdWhySince is back-dated so a tick counts, instead of the harness
// sitting here for the twelve real seconds it takes.
const BLANK_WORLD = `window.__rcBlank2 = (function () {
  var out = {}, reports = [];
  var realBuild = _buildChunk, realTileCt = _tileCt, realRep = window.__reportClientError;
  var oldCanvas = canvas;
  var savedCamX = camera.x, savedCamY = camera.y;
  var savedVisible = _visibleSince;
  var THROWS = function () { throw new TypeError('getContext вернул null'); };
  window.__reportClientError = function (kind, msg) { reports.push(kind + ': ' + msg); };
  // The watchdog refuses to run at all while document.hidden: rAF is paused
  // then, so "nothing has drawn recently" means nothing. This pane is a
  // background tab whenever nobody is looking at it — the same reason frames()
  // above drives update/render directly instead of waiting on a vsync that
  // never comes — so the flag is pinned false here and handed back at the end.
  Object.defineProperty(document, 'hidden', { configurable: true, get: function () { return false; } });
  // Back-dated, not zeroed: the watchdog also stands down for four seconds
  // after the app comes back to the foreground, and zero is not four seconds
  // ago when the page itself is only two seconds old — which is exactly where
  // in the run this lands.
  state = 'playing'; activeTab = 0; _visibleSince = -1e9;
  _wdWhy = null; _wdStrikes = 0; _wdReported.clear();
  var b0 = document.getElementById('gfx-dead'); if (b0) b0.remove();

  var trace = [];
  // Guarded so this whole probe still RUNS against a client that has none of
  // this — which is the only way its assertions can be shown to fail on the
  // old code instead of all collapsing into one "the probe threw".
  function resetFaults() { if (typeof pixiResetFaults === 'function') pixiResetFaults(); }
  function draw() { render(1 / 60, performance.now()); }
  function tick() {
    draw();
    _wdWhySince = -1e9;                      // the four seconds, without waiting them
    // Kept in the output rather than only asserted on: when this section does
    // fail, the first question is always whether the watchdog ran at all —
    // it stands down for five separate reasons before it looks at anything —
    // and a strike counter that never moves looks identical either way.
    var pre = 'мир: ' + _worldBlankWhy() + ', взведён на ' + _wdWhy;
    _worldWatchdog();
    trace.push(pre + ' -> ' + _wdWhy + ', попытка ' + _wdStrikes
      + (banner() ? ', БАННЕР' : ''));
    if (_pixiRetryTimer) { clearTimeout(_pixiRetryTimer); _pixiRetryTimer = null; out.retried = true; }
  }
  function banner() { return document.getElementById('gfx-dead'); }

  // ── А. every chunk build throws ─────────────────────────────────────────
  // _built is incremented BEFORE the try, so two throwing chunks spend the
  // whole per-frame budget and _tileChunks is never handed anything. This is
  // the 0/0 from the real report.
  _buildChunk = THROWS;
  resetFaults(); buildTileCanvas(); draw();
  out.whyBuild   = _worldBlankWhy();
  out.chunksBuild = _chunkSprCache.size + '/' + _tileChunks.size;
  out.factsBuild = _worldFacts();

  // ── Б. the chunk range comes out empty ──────────────────────────────────
  // The other 0/0, and the only one the old recovery could fix. A finite
  // clamped camera cannot do this — its own bounds always overlap a chunk —
  // so it takes a camera that is not a number at all.
  _buildChunk = realBuild;
  resetFaults(); buildTileCanvas();
  camera.x = NaN; draw();
  out.factsRange = _worldFacts();

  // ── Б2. и ПОЧЕМУ камера вообще становилась NaN ─────────────────────────
  // W и H объявлялись без значения, а каждое присваивание камеры в клиенте —
  // это player.x - W / (2 * ZOOM). Всё, что ставило камеру до первого
  // resize() (а он ждёт размера #app, и на телефоне в WebView это бывает
  // позже первого gameStart), давало NaN при совершенно живом игроке —
  // ровно отчёт от 27 августа: "камера NaN,NaN · игрок 1770,1588 · чанки 0/0".
  //
  // Дальше это не лечилось само: updateCamera затухает ОТСТУП камеры к цели,
  // а (NaN - tx) — NaN, и Math.abs(NaN) < px — false. Один NaN держался всю
  // сессию, и мир не рисовался всё это время.
  //
  // W/H проверяются первыми: это сам источник, и он ни от чего тут не зависит.
  // updateCamera напрямую, а не весь update(): проверяется именно она, и один
  // кадр — это и есть утверждение. Лечиться должно само, а не через восемь
  // секунд и три страйка сторожа.
  camera.x = NaN; camera.y = NaN;
  updateCamera(1 / 60);
  out.camHealedX = camera.x; out.camHealedY = camera.y;
  resetFaults(); buildTileCanvas(); draw();
  out.chunksAfterHeal = _chunkSprCache.size + '/' + _tileChunks.size;

  camera.x = savedCamX; camera.y = savedCamY;

  // ── В. the pass throws AFTER the build, where _layer() swallows it ──────
  // The canvas is already in _tileChunks by the time the texture upload runs,
  // so this one reads 0/N — which is how it tells itself apart from the two
  // above, and why the layer fault count had to reach the same report.
  resetFaults(); buildTileCanvas();
  _tileCt = null; draw();
  out.chunksLayer = _chunkSprCache.size + '/' + _tileChunks.size;
  out.factsLayer = _worldFacts();
  _tileCt = realTileCt;

  // ── Г. recovery is given its chances, and then the player is told ───────
  _buildChunk = THROWS;
  resetFaults(); buildTileCanvas();
  _wdWhy = null; _wdStrikes = 0; _wdReported.clear(); reports.length = 0;
  tick(); out.armBanner    = !!banner();                     // first sighting only arms it
  tick(); out.strike1      = _wdStrikes; out.b1 = !!banner(); // camera repair
  tick(); out.strike2      = _wdStrikes; out.b2 = !!banner(); // renderer rebuilt
  out.rebuilt = canvas !== oldCanvas;
  tick(); out.strike3      = _wdStrikes; out.b3 = !!banner(); // told
  var box = banner();
  out.src    = box ? box.dataset.src : 'нет баннера';
  out.text   = box ? box.textContent.slice(0, 40) : '';
  var btn    = document.getElementById('gfx-dead-btn');
  out.hasBtn = !!btn && typeof btn.onclick === 'function';
  out.btnText = btn ? btn.textContent : '';
  out.reports = reports.slice();
  out.trace = trace.slice();

  // ── Д. the world comes back — the banner is a claim about right now ─────
  _buildChunk = realBuild;
  resetFaults(); buildTileCanvas();
  for (var i = 0; i < 30; i++) draw();
  out.healthyAgain = _worldBlankWhy();
  tick();
  out.bannerWithdrawn = !banner();
  out.strikesReset = _wdStrikes;

  // ── Е. two banners can never stack ──────────────────────────────────────
  // A dead renderer is also a blank world, so both of these can be true at
  // the same moment. One element id is what makes the second one silent.
  _pixiGiveUp({ unsupported: true });
  if (typeof _worldGiveUp === 'function') _worldGiveUp('no-tiles');
  out.count = document.querySelectorAll('#gfx-dead').length;
  out.stackSrc = document.getElementById('gfx-dead').dataset.src;

  // ── Ж. and is the thing actually ON SCREEN? ─────────────────────────────
  // Appending to document.body is not the same as being visible: this app has
  // shipped a message nobody could see before (locationError, under the
  // "Ожидание сервера…" overlay). Every full-screen overlay that can be up
  // when a renderer gives up is put up here and the browser is asked what is
  // actually painted at the banner's own centre.
  var covers = ['login-screen', 'char-select', 'cs-loading'];
  var restore = covers.map(function (id) {
    var el = document.getElementById(id);
    return { el: el, was: el ? el.style.display : null };
  });
  restore.forEach(function (r) { if (r.el) r.el.style.display = ''; });
  var bx = document.getElementById('gfx-dead');
  var rc = bx.getBoundingClientRect();
  var hit = document.elementFromPoint(Math.round(rc.left + rc.width / 2),
                                      Math.round(rc.top + rc.height / 2));
  out.onTop = !!hit && (hit === bx || bx.contains(hit));
  out.hitBy = hit ? (hit.id || hit.tagName.toLowerCase()) : 'ничего';
  out.covers = restore.filter(function (r) { return r.el; }).map(function (r) {
    return r.el.id + ' z' + getComputedStyle(r.el).zIndex;
  }).join(', ');
  out.bannerZ = getComputedStyle(bx).zIndex;
  restore.forEach(function (r) { if (r.el) r.el.style.display = r.was === null ? '' : r.was; });

  // Put everything back the way the rest of the run expects to find it.
  bx.remove();
  delete document.hidden;               // back to the prototype getter
  _visibleSince = savedVisible;
  window.__reportClientError = realRep;
  _wdWhy = null; _wdStrikes = 0; _wdReported.clear();
  draw();
  return out;
})();`;

async function blankWorldChecks(w) {
  head('чёрный экран: чем он вызван и что видит игрок');
  inject(w, BLANK_WORLD);
  const b = w.__rcBlank2;
  if (!b) { ok(false, 'проба чёрного экрана выполнилась'); return; }

  say('  А. сборка чанка падает:  чанки ' + b.chunksBuild);
  say('     ' + b.factsBuild);
  ok(b.whyBuild === 'no-tiles', 'сторож называет это no-tiles', String(b.whyBuild));
  ok(b.chunksBuild === '0/0', 'структура чанков ПУСТА — тот самый «чанки 0/0»', b.chunksBuild);
  ok(/СБОЙ_СБОРКИ x\d+/.test(b.factsBuild) && /getContext/.test(b.factsBuild),
     'отчёт называет причину: чанк не собрался, и чем именно',
     (b.factsBuild.match(/СБОЙ_СБОРКИ[^·]*/) || ['—'])[0].trim());
  ok(/слои ок/.test(b.factsBuild), 'и отличает это от упавшего слоя (слои ок)');

  say('  Б. камера не число: ' + b.factsRange);
  ok(/диапазон[^·]*ПУСТ/.test(b.factsRange),
     'отчёт называет ПУСТОЙ диапазон чанков — другая причина того же «0/0»',
     (b.factsRange.match(/диапазон[^·]*/) || ['—'])[0].trim());
  ok(!/СБОЙ_СБОРКИ/.test(b.factsRange), 'и не путает её со сбоем сборки');
  ok(Number.isFinite(b.camHealedX) && Number.isFinite(b.camHealedY),
    'камера NaN лечится за ОДИН кадр, а не за восемь секунд и три страйка',
    b.camHealedX + ',' + b.camHealedY);
  ok(b.chunksAfterHeal !== '0/0', 'и тайлы после этого строятся   ' + b.chunksAfterHeal);
  // W/H тут проверять НЕЧЕГО: страница уже прошла layout и resize(), так что
  // они конечны при любом объявлении. Источник проверяется по исходнику —
  // dev/bundle-check.js, «W и H объявлены со значением».

  say('  В. слой упал после сборки: чанки ' + b.chunksLayer);
  ok(b.chunksLayer !== '0/0' && b.chunksLayer.indexOf('0/') === 0,
     'канва уже в _tileChunks, спрайта нет — 0/N, а не 0/0', b.chunksLayer);
  ok(/слои tiles x\d+/.test(b.factsLayer),
     'отчёт называет упавший слой, а не молчит о нём',
     (b.factsLayer.match(/слои[^·]*/) || ['—'])[0].trim());

  head('игроку говорят — но только когда починить не вышло');
  (b.trace || []).forEach(t => say('  тик: ' + t));
  ok(b.armBanner === false, 'на первом же тике баннера НЕТ (сторож только взводится)');
  ok(b.strike1 === 1 && b.b1 === false, 'после первой попытки (камера) баннера нет');
  ok(b.strike2 === 2 && b.b2 === false, 'после второй попытки (пересборка рендерера) баннера нет');
  ok(b.rebuilt === true, 'вторая попытка действительно пересобрала рендерер (canvas заменён)');
  ok(b.strike3 === 3 && b.b3 === true, 'после третьей — игрок наконец что-то видит');
  ok(b.src === 'world', 'баннер помечен своим источником', String(b.src));
  ok(/[А-Яа-я]/.test(b.text), 'текст по-русски', b.text + '…');
  ok(b.hasBtn === true, 'и есть что нажать', b.btnText);
  ok(b.reports.some(r => r.indexOf('world-blank') === 0), 'операторам ушёл отчёт',
     (b.reports[0] || 'ни одного').slice(0, 60));

  ok(b.healthyAgain === null && b.bannerWithdrawn === true,
     'мир вернулся — баннер убран (извинение над рабочим миром — та же ложь)',
     'сторож: ' + String(b.healthyAgain));
  ok(b.strikesReset === 0, 'счётчик попыток сброшен');

  head('баннер про графику: один, и его действительно видно');
  ok(b.count === 1, 'два баннера не складываются друг на друга', b.count + ' шт');
  ok(b.stackSrc === 'gfx', 'первый успевший говорит, второй молчит', String(b.stackSrc));
  say('  поверх: ' + b.covers + '   баннер z' + b.bannerZ);
  ok(b.onTop === true,
     'баннер «нет WebGL» виден поверх сплэша, выбора персонажа и загрузки этажа',
     b.onTop ? '' : 'в этой точке нарисован #' + b.hitBy);
}

// ═══════════════════════════════════════════════════════════════════════════
//  GRAM wallet tab
// ═══════════════════════════════════════════════════════════════════════════
// Everything else in this harness watches the WebGL world. The wallet tab is
// plain DOM built from template literals, and it is checkable here for exactly
// the same reason the world is: nothing else in dev/ can see what was drawn.
// bundle-check proves the file parses and xss-check reads the source, but
// neither can tell you that a credited deposit actually puts a number on the
// screen — which is the one thing this tab now exists to do.
//
// The states below are driven from OUTSIDE the client — a fake socket and a
// fake wallet library are handed the frames a real server and a real wallet
// send, and everything after that is the shipped code. That is a deliberate
// step further out than this section used to sit: it called the UI's own
// handlers (onGramDepositIntent, onGramHistory) directly, which skipped
// js/network.js entirely — and js/network.js is where an address is converted
// into the form a person recognises. A test that starts after the conversion
// cannot see the conversion missing.
//
// ── the two seams everything below is driven through ────────────────────────
// Both are FAKES OF THE TRANSPORT, not of the client. Nothing in js/ is
// replaced, so every line under test is the shipped one.
//
//   TON_CONNECT_UI — the wallet library. tcWarmUp used to be stubbed out here
//     because the real one is 435 KB of third-party download, and stubbing it
//     also stubbed out the one line that turns a wallet's RAW `0:…` address
//     into the `UQ…` a person recognises (js/tonconnect.js, onStatusChange).
//     So the address format could not be checked at all: the harness handed
//     the row an already-friendly string and proved nothing about it.
//     _tcLoadScript() resolves immediately when TON_CONNECT_UI already exists,
//     so defining it here downloads nothing and lets _tcEnsure() build and
//     wire the REAL callback. The tests then hand it the raw form, which is
//     what a real wallet actually reports.
//
//   netWalletLink / netWalletUnlink — the client's two ways of telling the
//     SERVER which wallet this account has. They go out through
//     _emitWhenAuthed, which waits for a live, server-authed socket and gives
//     up after ~6s — and this harness deliberately has neither, so the real
//     ones could only ever sit in a retry loop and then toast «Нет соединения».
//     Replaced here for the same reason __rcSock replaces the incoming half:
//     they are the TRANSPORT. Nothing in the decision above them is faked, so
//     what is under test is the rule about WHEN a device may speak for the
//     account, which is the part that can be wrong.
//
//   __rcSock — a socket carrying only the GRAM frames. js/network.js converts
//     addresses as they arrive (_gramFriendly), so a test that called
//     onGramDepositIntent() directly walked past the conversion it meant to
//     check. __rcEmit(name, payload) is exactly what the server pushing that
//     frame does.
const WALLET_SETUP = `(function () {
  window.TON_CONNECT_UI = { TonConnectUI: function () {
    window.__rcTcSent = [];
    this.onStatusChange = function (cb) { window.__rcTcStatus = cb; return function () {}; };
    this.openModal = function () {};
    this.disconnect = function () { if (window.__rcTcStatus) window.__rcTcStatus(null); };
    this.sendTransaction = function (req) { window.__rcTcSent.push(req); return Promise.resolve({ boc: 'stub' }); };
  } };
  window.__rcSock = { _h: {}, on: function (n, f) { this._h[n] = f; return this; } };
  _initGramHandlers(window.__rcSock);
  window.__rcEmit = function (n, p) { var f = window.__rcSock._h[n]; if (f) f(p); };
  // Top-level function declarations in the bundle ARE properties of the frame's
  // window (only let/const are not — see the note at the top of this file), so
  // assigning here really does replace what _gramUnlinkWallet and
  // _onTonConnectChange call.
  window.__rcWalletSent = [];
  window.netWalletLink = function (address) { window.__rcWalletSent.push({ ev: 'walletLink', address: address }); };
  window.netWalletUnlink = function () { window.__rcWalletSent.push({ ev: 'walletUnlink' }); };
  activeTab = 5;
  window._profileTab = 'wallet';
  window._gramBalance = 12.5;
  window._vipData = { level: 5, deposited: 0, pending: [] };
  const p = document.getElementById('panel-profile');
  if (p) p.style.display = 'block';
  switchProfileTab('wallet');
})();`;

// ── raw → friendly, precomputed ─────────────────────────────────────────────
// The expected values are NOT recomputed here by a second copy of the
// algorithm — a check that reimplements what it is checking agrees with itself
// however wrong both halves are. They were produced by server/ton.js's own
// friendlyAddress, which has shipped for months and has its own suite in
// dev/gram-check.js, and pasted in as constants. If the client's port ever
// drifts from the server's, these go red.
const RAW_WALLET = '0:8fe52cb8b8a1e0f0b1c2d3e4f5061728394a5b6c7d8e9f00112233445566778a';
const UQ_WALLET  = 'UQCP5Sy4uKHg8LHC0-T1BhcoOUpbbH2OnwARIjNEVWZ3iipE';
const RAW_PLAT   = '0:2b1c9d4e5f60718293a4b5c6d7e8f90a1b2c3d4e5f60718293a4b5c6d7e8f90a';
const UQ_PLAT    = 'UQArHJ1OX2BxgpOktcbX6PkKGyw9Tl9gcYKTpLXG1-j5CkAw';
const RAW_WD     = '0:cafe0babe1234567890abcdef1234567890abcdef1234567890abcdef1234567';
const UQ_WD      = 'UQDK_gur4SNFZ4kKvN7xI0VniQq83vEjRWeJCrze8SNFZwXZ';
// The wallet the SERVER says this account is linked to — a different one from
// RAW_WALLET on purpose, so "the desktop shows the account's wallet" cannot be
// satisfied by accidentally showing the browser's session instead.
const RAW_LINK   = '0:5e1b7c9d0a3f4e5d6c7b8a99887766554433221100ffeeddccbbaa9988776655';
const UQ_LINK    = 'UQBeG3ydCj9OXWx7ipmId2ZVRDMiEQD_7t3Mu6qZiHdmVbZS';
// Any workchain, any 64 hex digits — the shape a raw address has and a friendly
// one cannot. Used to sweep the whole rendered page rather than the one node a
// test happened to think of.
const RAW_ANYWHERE = /(^|[^\w])-?\d+:[0-9a-fA-F]{64}/;

async function walletChecks(w) {
  const d = () => w.document;
  const q = sel => d().querySelector(sel);
  const all = sel => d().querySelectorAll(sel);
  const txt = sel => { const e = q(sel); return e ? e.textContent.replace(/\s+/g, ' ').trim() : ''; };
  // A promise inside the frame has to be allowed to settle before the DOM it
  // writes can be read. Everything else here is synchronous; the wallet send
  // is not.
  const settle = () => new Promise(r => setTimeout(r, 40));
  const errBefore = (w.__rcErrors || []).length;

  head('кошелёк GRAM — вкладка');
  inject(w, WALLET_SETUP);
  // updateGramUI calls the real tcWarmUp, which builds the (faked) library one
  // microtask later. Nothing below can drive a wallet status before that.
  await settle();
  ok(!!q('#gram-body .gram-balance-card'), 'вкладка отрисована: карточка баланса на месте');
  ok(!!q('.gram-balance-chip svg'), 'фирменный знак GRAM встроен в карточку (не <img>)');
  // The mark is a BRAND mark: if it ever picks up currentColor it changes
  // colour with whatever panel it sits in, which is the one thing it must not
  // do. Its own blue has to survive into the DOM.
  ok((q('.gram-balance-chip svg') || { innerHTML: '' }).innerHTML.indexOf('#30A1F5') >= 0,
     'знак GRAM сохранил свой синий, а не взял currentColor');
  ok(txt('#gram-balance-val').indexOf('GRAM') >= 0, 'единица валюты на месте', txt('#gram-balance-val'));
  ok(!!q('.gram-bal-whole') && !!q('.gram-bal-frac'), 'баланс разбит на целую и дробную часть');
  ok(all('.gram-action').length === 2, 'две кнопки действий', all('.gram-action').length + ' шт');
  ok(!!q('.gram-action-dep svg') && !!q('.gram-action-wd svg'),
     'обе кнопки несут встроенные SVG-иконки, а не текстовые стрелки');
  ok((q('.gram-action-dep svg') || { outerHTML: '' }).outerHTML.indexOf('800') < 0,
     'иконки не тащат в DOM холст 800px');
  ok((q('.gram-action-dep svg') || { outerHTML: '' }).outerHTML.indexOf('currentColor') >= 0,
     'иконки UI взяли currentColor вместо fill="#000000"');
  ok(!!q('.gram-airdrop-img'), 'место под airdrop-картинку размечено');
  ok((q('.gram-airdrop-img') || {}).getAttribute && Number(q('.gram-airdrop-img').getAttribute('width')) <= 96,
     'airdrop-картинка не растянута больше 96px (192px-вырезка мылится дальше)',
     (q('.gram-airdrop-img') || {}).getAttribute ? q('.gram-airdrop-img').getAttribute('width') + 'px' : '?');

  head('кошелёк GRAM — подключённый кошелёк');
  ok(!!q('.gram-wallet-card-off') && !!q('.gram-connect-btn'), 'без кошелька — приглашение подключить');
  ok(typeof w.__rcTcStatus === 'function', 'библиотека кошелька поднялась и отдала свой onStatusChange');
  // ── ФОРМАТ АДРЕСА ────────────────────────────────────────────────────────
  // The wallet reports the RAW form and always has. What goes in here is
  // exactly what TON Connect hands over; what comes out on screen has to be
  // the UQ… a player can compare against their own wallet app.
  inject(w, `__rcTcStatus({ account: { address: '${RAW_WALLET}' } });`);
  ok(!!q('.gram-wallet-chip-on'), 'подключённый кошелёк отрисован как карточка со значком');
  ok(txt('#gram-tc-addr-val') === UQ_WALLET,
     'сырой 0:… адрес кошелька превращён в UQ… — тот же байт в байт, что даёт server/ton.js',
     txt('#gram-tc-addr-val'));
  ok(txt('#gram-tc-addr-val').length === 48, 'длина адреса — ровно 48 символов дружелюбной формы',
     txt('#gram-tc-addr-val').length + ' симв.');
  ok(!!q('.gram-wallet-short') && txt('.gram-wallet-short').indexOf('UQ') === 0,
     'короткая форма тоже UQ…, а не 0:…', txt('.gram-wallet-short'));
  // The sweep, not the node: a test that checks the one element it thought of
  // is a test the next element added to this card walks straight past.
  ok(!RAW_ANYWHERE.test(d().body.innerText || ''),
     'сырой формат 0:… не отрисован НИГДЕ на странице',
     (RAW_ANYWHERE.exec(d().body.innerText || '') || ['—'])[0]);
  // The rename the owner asked for. Checked as rendered text, not as a
  // translation key: a key can be right while the button still says the old
  // word because the render never picked it up.
  ok(txt('.gram-unlink-btn') === 'Отвязать', 'кнопка называется «Отвязать», а не «Отключить»', txt('.gram-unlink-btn'));
  // The owner asked for the icon gone, not smaller. Asserted as "no svg
  // anywhere in the button" rather than as the absence of one helper, because
  // the way an icon comes back is a different helper.
  ok(!q('.gram-unlink-btn svg') && !q('.gram-unlink-btn img'),
     'иконки на «Отвязать» нет — только слово');
  ok(typeof w._gramIconUnlink !== 'function', 'и сама иконка удалена вместе с кнопкой, а не осталась лежать');
  ok(w.getComputedStyle(q('.gram-unlink-btn')).borderStyle !== 'none', 'у «Отвязать» есть настоящая рамка');
  ok(!!q('.gram-copy-chip'), 'адрес можно скопировать');

  // The other place the connected address lands, and the one that would send
  // money back to it: the withdrawal form auto-fills from tcAddress().
  inject(w, `openGramWithdrawModal(); window.__rcWdAddr = (document.getElementById('gram-wd-addr') || {}).value;`);
  ok(w.__rcWdAddr === UQ_WALLET, 'форма вывода подставляет UQ…, а не сырой адрес', String(w.__rcWdAddr));
  inject(w, 'closeGramModal();');

  head('кошелёк GRAM — модалка пополнения');
  inject(w, 'openGramDepositModal();');
  // The whole interaction change, asserted directly: the button is gone and so
  // is the function behind it. A leftover handler is how a removed button
  // comes back in a later edit.
  ok(!q('#gram-dep-paid-btn'), 'кнопки «Я оплатил» больше нет');
  ok(d().body.innerHTML.indexOf('Я оплатил') < 0, 'и строки «Я оплатил» на экране тоже нет');
  ok(typeof w.gramDepositConfirm !== 'function', 'обработчик gramDepositConfirm удалён вместе с кнопкой');
  ok(!!q('#gram-dep-code .gram-spinner'), 'пока код не пришёл — состояние загрузки');

  // Through the SOCKET, not through onGramDepositIntent — the conversion lives
  // in js/network.js, and a test that calls the UI entry point directly walks
  // past it. GRAM_WALLET is configured by hand and server/ton.js validAddress
  // accepts `0:…` as readily as `UQ…`, so this raw payload is a shape the
  // server really can send.
  inject(w, `__rcEmit('gramDepositIntent', { memo: 'LBT-a1b2c3d4e5f6', address: '${RAW_PLAT}', minAmount: 0.05, expiresAt: new Date(Date.now() + 1800000).toISOString() });`);
  ok(txt('#gram-addr-val') === UQ_PLAT, 'адрес пополнения показан в UQ…, а не сырым', txt('#gram-addr-val'));
  ok(!RAW_ANYWHERE.test(d().body.innerText || ''), 'и сырого 0:… нигде в открытой модалке нет');
  ok(txt('#gram-memo-val') === 'LBT-a1b2c3d4e5f6', 'код (memo) показан', txt('#gram-memo-val'));
  ok(all('#gram-dep-code .gram-copy-row').length === 2, 'адрес и код — две отдельные строки с копированием',
     all('#gram-dep-code .gram-copy-row').length + ' шт');
  ok(!!q('.gram-dep-watch'), 'модалка говорит, что ЖДЁТ перевод — вместо кнопки-подтверждения');
  ok(txt('.gram-dep-watch-sub').indexOf('закрыть') >= 0,
     'и что окно можно закрыть (зачисление придёт push-ом, а не по нажатию)', txt('.gram-dep-watch-sub'));

  head('кошелёк GRAM — деньги пришли');
  inject(w, `onGramDepositCredited({ amount: 2.5, balance: 15, memo: 'LBT-a1b2c3d4e5f6', txHash: 'f00dcafe1234567890abcdef', at: Date.now() });`);
  ok(!!q('.gram-dep-ok'), 'модалка перевернулась в состояние успеха');
  ok(txt('.gram-dep-ok-amount').indexOf('2.5') >= 0, 'сумма зачисления на экране', txt('.gram-dep-ok-amount'));
  ok(txt('.gram-dep-ok').indexOf('15') >= 0, 'новый баланс на экране');
  ok(!q('#gram-memo-val'), 'потраченный код убран — второй перевод по нему не примут');
  ok(!!q('.gram-dep-ok .gram-credit-chip svg'), 'галочка нарисована SVG-иконкой');
  inject(w, 'window.__rcBal = window._gramBalance;');
  ok(w.__rcBal === 15, 'баланс взят с сервера, а не досчитан локально', String(w.__rcBal));

  // ── THE ROUND TRIP TO THE WALLET AND BACK ────────────────────────────────
  // The journey the owner reported: pick an amount, pay from the wallet, the
  // wallet app takes over the screen, approve, come back. That is the NORMAL
  // path, and the sheet used to be gone by the time the player returned —
  // _tcDepositSend called closeGramModal() the instant sendTransaction
  // resolved. Somebody who has just sent real money and finds a folded panel
  // concludes it failed.
  head('кошелёк GRAM — оплата из кошелька: лист обязан пережить поход туда и обратно');
  inject(w, `closeGramModal(); openGramDepositModal();
    __rcEmit('gramDepositIntent', { memo: 'LBT-pay000000001', address: '${RAW_PLAT}', minAmount: 0.05, expiresAt: new Date(Date.now() + 1800000).toISOString() });
    document.getElementById('gram-dep-amount').value = '1.5';
    _renderTonDepositSection();`);
  ok(!!q('#ton-deposit-send-btn') && !q('#ton-deposit-send-btn[disabled]'),
     'кнопка «отправить из кошелька» активна, когда сумма введена');
  inject(w, '_tcDepositSend();');
  await settle();
  ok((w.__rcTcSent || []).length === 1, 'перевод ушёл в кошелёк ровно один раз',
     (w.__rcTcSent || []).length + ' шт');
  // The conversion is on the MONEY path too, not only on the display one.
  ok(((w.__rcTcSent || [])[0] || { messages: [{}] }).messages[0].address === UQ_PLAT,
     'и ушёл на UQ…-адрес, а не на сырой',
     String((((w.__rcTcSent || [])[0] || { messages: [{}] }).messages[0] || {}).address));
  ok(!!q('#gram-modal-wrap'), 'ЛИСТ НЕ СХЛОПНУЛСЯ после подписи — он на экране');
  ok(!!q('.gram-dep-wait'), 'и показывает ожидание, а не пустоту');
  ok(txt('.gram-dep-sent-amount').indexOf('1.5') >= 0, 'с суммой, которую только что отправили',
     txt('.gram-dep-sent-amount'));
  ok(txt('.gram-dep-sent-memo').indexOf('LBT-pay000000001') >= 0, 'и с кодом, по которому её найдут',
     txt('.gram-dep-sent-memo'));
  ok(!!q('.gram-dep-wait .gram-spinner'), 'спиннер крутится, пока ожидание обычное');
  ok(txt('.gram-dep-wait').indexOf('закрыть') >= 0,
     'и сказано, что окно можно закрыть — зачисление придёт push-ом', txt('.gram-dep-wait'));
  // The form goes for the same reason it goes on success: a second signature
  // against a code that is already carrying money is a real double payment.
  ok(!!q('#gram-dep-form') && w.getComputedStyle(q('#gram-dep-form')).display === 'none',
     'форма с суммой и кнопкой убрана — второй перевод по тому же коду был бы двойной оплатой');
  inject(w, 'window.__rcSlowArmed = !!_gramSlowTimer;');
  ok(w.__rcSlowArmed === true, 'заведён таймер, после которого спиннер перестанет обещать «вот-вот»');

  // Возврат из кошелька: WebView уходит в фон и приходит обратно, и на это
  // подписаны и js/game.js, и js/network.js. Именно на этом пути лист пропадал,
  // и именно здесь его обязан не трогать любой будущий обработчик.
  inject(w, `(function () {
    var vis = 'hidden';
    Object.defineProperty(document, 'visibilityState', { configurable: true, get: function () { return vis; } });
    document.dispatchEvent(new Event('visibilitychange'));
    vis = 'visible';
    document.dispatchEvent(new Event('visibilitychange'));
    window.dispatchEvent(new Event('resize'));
    delete document.visibilityState;
  })();`);
  await settle();
  ok(!!q('#gram-modal-wrap') && !!q('.gram-dep-wait'),
     'после цикла «свернули — развернули» лист и ожидание на месте');
  ok(txt('.gram-dep-sent-memo').indexOf('LBT-pay000000001') >= 0, 'и код не потерялся по дороге');

  // Спиннер, который крутится вечно, — это отдельный баг. Что таймер заведён,
  // проверено выше; здесь проверяется то, во что он переключает — ждать
  // GRAM_DEPOSIT_SLOW_MS в наборе, который должен пройти за секунды, нельзя.
  inject(w, `_setGramDepositState('slow');`);
  ok(!!q('.gram-dep-wait-slow'), 'затянувшееся ожидание — отдельное состояние, а не тот же спиннер');
  ok(!q('.gram-dep-wait .gram-spinner'), 'спиннер остановлен — он больше не обещает «вот-вот»');
  ok(!!q('.gram-dep-wait svg'), 'на его месте часы');
  ok(txt('.gram-dep-wait').indexOf('дней') >= 0,
     'и сказано, что код живёт ещё несколько дней и деньги не потеряны', txt('.gram-dep-wait'));
  ok(txt('.gram-dep-sent-amount').indexOf('1.5') >= 0, 'сумма и код никуда не делись');

  // И зачисление всё равно переворачивает лист — из ЛЮБОГО ожидания.
  inject(w, `onGramDepositCredited({ amount: 1.5, balance: 16.5, memo: 'LBT-pay000000001', txHash: 'aa11bb22', at: Date.now() });`);
  ok(!!q('.gram-dep-ok'), 'зачисление переворачивает лист в успех прямо из ожидания');
  ok(!q('.gram-dep-wait'), 'и ожидание убрано');
  inject(w, 'window.__rcPendAfter = _gramSentPending;');
  ok(w.__rcPendAfter === null,
     'ожидание снято до отрисовки — таймер уже не перепишет успех обратно в «задерживается»');

  // The half that is easy to leave out: the credit arriving with nothing open.
  head('кошелёк GRAM — зачисление при ЗАКРЫТОЙ модалке');
  inject(w, 'closeGramModal(); _gramDismissCredit();');
  ok(!q('#gram-dep-code'), 'модалка закрыта');
  inject(w, `onGramDepositCredited({ amount: 7.25, balance: 22.25, memo: 'LBT-999', txHash: 'beef', at: Date.now() });`);
  ok(!!q('#gram-credit-toast'), 'зачисление всё равно показано — всплывающей карточкой');
  ok(txt('#gram-credit-toast').indexOf('7.25') >= 0, 'с суммой', txt('#gram-credit-toast'));
  ok(txt('#gram-credit-toast').indexOf('22.25') >= 0, 'и с новым балансом');
  inject(w, 'switchProfileTab("wallet");');
  ok(!!q('.gram-credit-card'), 'и остаётся баннером наверху вкладки, когда её откроют');
  ok(txt('#gram-balance-val').indexOf('22.25') >= 0, 'баланс на карточке обновился', txt('#gram-balance-val'));
  inject(w, 'var _t = document.getElementById("gram-credit-toast"); if (_t) _t.remove();');

  head('кошелёк GRAM — статус каждой строки истории');
  inject(w, `onGramHistory([
    { id: 1, type: 'deposit',  amount: 2.5,  status: 'confirmed', memo: 'LBT-1', createdAt: Date.now() },
    { id: 2, type: 'deposit',  amount: 0.05, status: 'expired',   memo: 'LBT-2', createdAt: Date.now() },
    { id: 3, type: 'deposit',  amount: 0.05, status: 'pending',   memo: 'LBT-3', createdAt: Date.now() },
    { id: 4, type: 'withdraw', amount: 10,   status: 'rejected',  createdAt: Date.now() },
    { id: 5, type: 'withdraw', amount: 5,    status: 'forfeited', createdAt: Date.now() }
  ]);`);
  ok(all('#gram-history-list .gram-tx-row').length === 5, 'пять строк истории',
     all('#gram-history-list .gram-tx-row').length + ' шт');
  ok(all('.gram-tx-ok').length === 1, 'зачисленное — своим статусом');
  // The two the old two-way test could not tell apart from "в обработке".
  ok(all('.gram-tx-dim').length === 1, 'истёкший интент помечен как истёкший, а не «Ожидание»');
  ok(all('.gram-tx-no').length === 2, 'отклонённое и аннулированное — отдельным статусом',
     all('.gram-tx-no').length + ' шт');
  ok(all('.gram-tx-wait').length === 1, 'и только реально ожидающее — «Ожидание»');
  ok(txt('#gram-history-list .gram-tx-row .gram-tx-status') === '✓ Выполнено',
     'подпись статуса рендерится', txt('#gram-history-list .gram-tx-row .gram-tx-status'));
  // A pending deposit's amount is the INTENT minimum, not what the player
  // sent. Printing it promises a figure nobody transferred.
  ok(all('.gram-tx-wait .gram-tx-amount').length === 0,
     'сумма ожидающего пополнения НЕ показана — это минимум интента, а не перевод');
  // The live push (server/app.js notifyCredited) says 'credited'; the database
  // and gramHistory say 'confirmed'. Same event, two spellings — a client that
  // knew only one showed money that had just landed as «Ожидание».
  inject(w, `onGramHistory([{ id: 7, type: 'deposit', amount: 3, status: 'credited', memo: 'LBT-7', createdAt: Date.now() }]);`);
  ok(all('.gram-tx-ok').length === 1 && all('.gram-tx-wait').length === 0,
     'живой статус credited понят так же, как confirmed из истории',
     txt('#gram-history-list .gram-tx-status'));
  // gram_tx.address is whatever went into the row — for a withdrawal, what the
  // player typed, which for months was the raw address this very client
  // auto-filled. No row renderer prints it today; the conversion is at the
  // boundary precisely so that the day one does, it cannot print a `0:…`.
  inject(w, `__rcEmit('gramHistory', { txs: [
      { id: 11, type: 'withdraw', amount: 10, status: 'pending', address: '${RAW_WD}', createdAt: Date.now() },
      { id: 12, type: 'deposit',  amount: 1,  status: 'confirmed', memo: 'LBT-11', createdAt: Date.now() }
    ] });
    window.__rcHistAddr = (_gramTxList[0] || {}).address;`);
  ok(w.__rcHistAddr === UQ_WD, 'адрес в строке истории нормализован ещё на входе с сокета',
     String(w.__rcHistAddr));
  ok(all('#gram-history-list .gram-tx-row').length === 2, 'строки истории всё так же отрисованы',
     all('#gram-history-list .gram-tx-row').length + ' шт');

  head('кошелёк GRAM — чужой текст в DOM');
  // memo and address arrive over the socket. They are the server's own values,
  // but they land in innerHTML, and this asserts the escaping actually happens
  // at render time rather than being assumed upstream.
  inject(w, `onGramHistory([{ id: 9, type: 'deposit', amount: 1, status: 'confirmed', memo: '<img src=x onerror=window.__rcPwn=1>', createdAt: Date.now() }]);`);
  // Through the socket, so the address converter is on the path: it has to
  // hand anything that is not an address straight back, unchanged and still
  // unescaped, leaving the escaping to the render exactly as before.
  inject(w, `openGramDepositModal(); __rcEmit('gramDepositIntent', { memo: '<img src=y onerror=window.__rcPwn=2>', address: '<svg onload=window.__rcPwn=3>', minAmount: 0, expiresAt: null });`);
  ok(all('#gram-history-list img').length === 0, 'memo из истории не превратился в тег');
  ok(all('#gram-dep-code img').length === 0 && all('#gram-dep-code svg[onload]').length === 0,
     'memo и адрес из intent не превратились в теги');
  ok(txt('#gram-addr-val') === '<svg onload=window.__rcPwn=3>',
     'не-адрес прошёл через конвертер как есть — он не чинит и не портит чужой текст',
     txt('#gram-addr-val'));
  inject(w, 'window.__rcPwnOut = window.__rcPwn || 0;');
  ok(!w.__rcPwnOut, 'ни один инъецированный обработчик не выполнился', String(w.__rcPwnOut));
  inject(w, 'closeGramModal();');

  head('кошелёк GRAM — отказ обязан быть виден');
  // The rule this tab broke worst: _gramMsg wrote into a strip that only
  // exists while the WALLET tab is rendered, so every refusal that arrived
  // with the player on Язык, Друзья or in the dungeon was dropped in silence.
  inject(w, `switchProfileTab('lang');`);
  ok(!q('#gram-msg'), 'на другой вкладке полоски сообщений действительно нет');
  inject(w, `_gramMsg('ОТКАЗ-ПРОВЕРКА', 'err');
    window.__rcRefusalSeen = Array.prototype.some.call(document.body.children,
      function (n) { return n.textContent === 'ОТКАЗ-ПРОВЕРКА'; });`);
  ok(w.__rcRefusalSeen === true, 'отказ всё равно показан игроку, а не проглочен');
  inject(w, `switchProfileTab('wallet');`);
  inject(w, `_gramMsg('ОТКАЗ-В-ПОЛОСКЕ', 'err'); window.__rcStrip = (document.getElementById('gram-msg') || {}).textContent;`);
  ok(w.__rcStrip === 'ОТКАЗ-В-ПОЛОСКЕ', 'а на самой вкладке — в её собственной полоске', String(w.__rcStrip));
  // With a modal up, the panel strip is behind its backdrop — writing there is
  // the same as writing nowhere.
  inject(w, `openGramDepositModal(); _gramMsg('ОТКАЗ-ПОВЕРХ-МОДАЛКИ', 'err');
    window.__rcModalMsg = (document.getElementById('gram-modal-msg') || {}).textContent;`);
  ok(w.__rcModalMsg === 'ОТКАЗ-ПОВЕРХ-МОДАЛКИ',
     'при открытой модалке отказ уходит в неё, а не под её же затемнение', String(w.__rcModalMsg));
  inject(w, 'closeGramModal();');


  // ═════════════════════════════════════════════════════════════════════════
  //  ПК и телефон: привязка живёт на СЕРВЕРЕ, подпись — на устройстве
  // ═════════════════════════════════════════════════════════════════════════
  // "на телефоні в мене привязаний гаманець тон а на пк пише підключити
  // гаманець". The address lived in ONE browser's localStorage and was written
  // down nowhere, so the desktop had nothing to show and said so — correctly,
  // about a question it had no way to answer.
  //
  // Everything below is the DESKTOP: the wallet library is up (tcWarmUp built
  // it when the tab rendered), no session was restored into it, and the server
  // says the account has a wallet. Driven through the socket rather than by
  // setting a variable, so js/network.js's walletState handler — and the
  // address conversion inside it — are on the path.
  head('кошелёк GRAM — ПК: сервер знает про кошелёк, а подписать здесь нечем');
  inject(w, `if (window.__rcTcStatus) __rcTcStatus(null);
    window.__rcWalletSent = [];
    __rcEmit('walletState', { address: '${RAW_LINK}', everLinked: true, stored: true });
    window.__rcLocal = (typeof tcAddress === 'function') ? tcAddress() : 'нет функции';`);
  // The precondition, asserted rather than assumed: BOTH halves of the split at
  // once. Without it every check below could be satisfied by a browser that
  // still had a session — which is the phone, not the desktop, and the phone
  // was never broken.
  ok(w.__rcLocal === null && !!w._linkedWallet,
     'это ПК: сервер сказал про кошелёк, а сессии TON Connect тут нет',
     'локально ' + String(w.__rcLocal) + ' · на аккаунте ' + String(w._linkedWallet));
  ok(!!q('.gram-wallet-chip-on') && !q('.gram-wallet-card-off'),
     'ПК показывает ПРИВЯЗАННЫЙ кошелёк, а не приглашение подключить');
  ok(txt('.gram-wallet-status') === 'Кошелёк привязан',
     'и называет это привязкой (факт аккаунта), а не подключением (факт браузера)',
     txt('.gram-wallet-status'));
  // The sweep is folded into the same assertion, not left standing on its own:
  // on a client that never renders the address at all, "no raw form anywhere" is
  // true and means nothing. It is a claim ABOUT the address being on screen.
  ok(txt('#gram-tc-addr-val') === UQ_LINK && !RAW_ANYWHERE.test(d().body.innerText || ''),
     'адрес с сервера показан в UQ… и нигде не просочился сырым — конвертация на границе сокета',
     txt('#gram-tc-addr-val'));
  // The half that keeps the card honest. A device that cannot sign must not be
  // shown the same card as one that can — otherwise «Отправить из кошелька»
  // is offered to a browser that will refuse it, which is the black screen
  // again in a smaller frame.
  ok(!!q('#gram-wallet-note') && txt('#gram-wallet-note').indexOf('этом устройстве') >= 0,
     'и тут же сказано, что ОТСЮДА отправить нельзя — карточка не выдаёт привязку за подпись',
     txt('#gram-wallet-note'));
  ok(!!q('#gram-wallet-note .gram-connect-btn'),
     'с кнопкой подключить кошелёк ИМЕННО ЗДЕСЬ — выход, а не сообщение о тупике');
  ok(txt('.gram-unlink-btn') === 'Отвязать',
     '«Отвязать» на ПК есть — это тоже факт аккаунта, и убрать его можно откуда угодно',
     txt('.gram-unlink-btn'));

  // ── отправка обязана отказать там, где подписывать нечем ─────────────────
  head('кошелёк GRAM — ПК: отправка из кошелька отказывает, а не врёт');
  inject(w, `openGramDepositModal();
    __rcEmit('gramDepositIntent', { memo: 'LBT-pc0000000001', address: '${RAW_PLAT}', minAmount: 0.05, expiresAt: new Date(Date.now() + 1800000).toISOString() });
    document.getElementById('gram-dep-amount').value = '2';
    _renderTonDepositSection();
    window.__rcSentBefore = (window.__rcTcSent || []).length;`);
  // Stated as a pair on purpose. "No send button" alone is also true of a client
  // that knows nothing about any wallet, so it would pass for the wrong reason.
  // What has to hold is that the ACCOUNT IS LINKED and the button is still not
  // offered — because after this change _renderTonDepositSection is one edit away
  // from using window._linkedWallet like everything else on the panel, and that
  // edit would put a live «Отправить из кошелька» on a browser that cannot sign.
  ok(!q('#ton-deposit-send-btn') && !!w._linkedWallet,
     'кошелёк привязан, а кнопки «отправить из кошелька» на ПК всё равно нет — подписывать нечем',
     'на аккаунте ' + String(w._linkedWallet));
  ok(txt('#ton-deposit-send-wrap').indexOf('этом устройстве') >= 0,
     'и сказано, что дело в УСТРОЙСТВЕ, а не в том, что кошелёк не привязан',
     txt('#ton-deposit-send-wrap'));
  // The render gate is not the guard. The sheet survives a round trip to the
  // wallet app, a session can go away while it is open, and the old code
  // answered that with «Не удалось отправить транзакцию» — a player told their
  // transfer failed when nothing was ever attempted, and no way to act on it.
  inject(w, '_tcDepositSend();');
  await settle();
  ok(txt('#gram-modal-msg').indexOf('этом устройстве') >= 0
     && (w.__rcTcSent || []).length === w.__rcSentBefore,
     'прямой вызов отправки отказал по-человечески и НИЧЕГО не отправил',
     txt('#gram-modal-msg') + ' · переводов +' + ((w.__rcTcSent || []).length - w.__rcSentBefore));

  // The other thing the desktop could not do: fill in where the money goes.
  inject(w, `closeGramModal(); openGramWithdrawModal();
    window.__rcWdPc = (document.getElementById('gram-wd-addr') || {}).value;
    window.__rcWdHint = (document.getElementById('ton-wd-connect-wrap') || {}).innerHTML;`);
  ok(w.__rcWdPc === UQ_LINK,
     'форма вывода на ПК подставляет адрес АККАУНТА — раньше она открывалась пустой',
     String(w.__rcWdPc));
  ok(!/<button/.test(w.__rcWdHint || ''),
     'и не зовёт подключать кошелёк ради поля, которое уже заполнено',
     String(w.__rcWdHint || '').slice(0, 60));
  inject(w, 'closeGramModal();');

  // ── кто вправе говорить за аккаунт ───────────────────────────────────────
  head('кошелёк GRAM — кто вправе говорить за аккаунт');
  // A RESTORED session is what a launch looks like: no modal, the wallet simply
  // appears. If that could overwrite the account, opening the phone would move
  // the payout address back to a wallet the player had already replaced on the
  // desktop — silently, and the withdrawal form would pre-fill it from then on.
  inject(w, `window.__rcWalletSent = [];
    __rcTcStatus({ account: { address: '${RAW_WALLET}' } });`);
  ok((w.__rcWalletSent || []).length === 0
     && txt('.gram-wallet-status') === 'Кошелёк привязан'
     && txt('#gram-tc-addr-val') === UQ_LINK,
     'восстановленная сессия НЕ перезаписывает привязку: телефон не отменяет выбор, сделанный на ПК',
     'ушло ' + (w.__rcWalletSent || []).length + ' пакетов · на карточке ' + txt('#gram-tc-addr-val'));
  ok(!!q('#gram-wallet-note') && txt('#gram-wallet-note').indexOf('другой кошелёк') >= 0,
     'но про второй кошелёк на этом устройстве сказано, а не умолчано',
     txt('#gram-wallet-note'));
  // And the way out of that state without an operator — one press that makes
  // the restored session a decision.
  inject(w, '_gramLinkThisWallet();');
  ok((w.__rcWalletSent || []).length === 1
     && ((w.__rcWalletSent || [])[0] || {}).address === UQ_WALLET,
     'одно нажатие «Привязать этот кошелёк» отправляет именно его — сменить кошелёк можно без поддержки',
     JSON.stringify(w.__rcWalletSent || []));
  // A wallet the player just picked in the modal always wins, restored session
  // or not. tcConnect() is the only path a person can take, and it is what
  // marks the status change that follows as deliberate.
  inject(w, `window.__rcWalletSent = [];
    __rcEmit('walletState', { address: '${RAW_LINK}', everLinked: true, stored: true });
    tcConnect();`);
  await settle();
  inject(w, `__rcTcStatus({ account: { address: '${RAW_WD}' } });`);
  ok((w.__rcWalletSent || []).length === 1
     && ((w.__rcWalletSent || [])[0] || {}).address === UQ_WD,
     'а кошелёк, подключённый игроком здесь и сейчас, заменяет привязку аккаунта — newest wins',
     JSON.stringify(w.__rcWalletSent || []));

  // ── «Отвязать» отвязывает АККАУНТ ────────────────────────────────────────
  head('кошелёк GRAM — «Отвязать» отвязывает аккаунт, а не браузер');
  inject(w, `window.__rcWalletSent = [];
    __rcEmit('walletState', { address: '${RAW_LINK}', everLinked: true, stored: true });
    _gramUnlinkWallet();`);
  ok((w.__rcWalletSent || []).some(function (e) { return e.ev === 'walletUnlink'; }),
     '«Отвязать» уходит на сервер — иначе на втором устройстве кошелёк остался бы привязан',
     JSON.stringify(w.__rcWalletSent || []));
  ok(txt('.gram-wallet-status') === 'Кошелёк привязан' && txt('#gram-tc-addr-val') === UQ_LINK,
     'до ответа сервера карточка не заявляет, что аккаунт уже отвязан',
     txt('.gram-wallet-status') + ' · ' + txt('#gram-tc-addr-val'));
  // The strip is emptied first, so what fills it can only have come from the
  // server's reply — the old client announced «Кошелёк отвязан» the moment the
  // BROWSER dropped its own session, which is a claim it was not in a position
  // to make.
  inject(w, `var _ms = document.getElementById('gram-msg');
    if (_ms) { _ms.textContent = ''; _ms.style.display = 'none'; }
    __rcEmit('walletState', { address: null, everLinked: true, stored: true });`);
  ok(!!q('.gram-wallet-card-off') && txt('#gram-msg').indexOf('твязан') >= 0,
     'подтверждение приходит от СЕРВЕРА, и только тогда карточка становится «не привязан»',
     txt('#gram-msg'));
  // Pre-015 the column is not there, the server says so, and the panel must not
  // draw a link the database refused to keep.
  inject(w, `__rcEmit('walletState', { address: null, everLinked: false, stored: false });
    window.__rcEverAfter = window._walletEverLinked;`);
  ok(w.__rcEverAfter === false && !!q('.gram-wallet-card-off'),
     'сервер без миграции 015 честно говорит «не сохранено» — и клиент не рисует привязку',
     String(w.__rcEverAfter));
  // The same window with a session on THIS device. The card may say «подключён»
  // — a fact about the browser, which is true — and must not say «привязан», a
  // fact about the account, which is not. That is the one thing a server
  // echoing back an address it never wrote would have made it say, on every
  // device the player opened next, until the following login quietly took it
  // away again.
  inject(w, `__rcTcStatus({ account: { address: '${RAW_WALLET}' } });
    __rcEmit('walletState', { address: null, everLinked: false, stored: false });`);
  ok(txt('.gram-wallet-status') === 'Кошелёк подключён'
     && txt('#gram-tc-addr-val') === UQ_WALLET
     && w._linkedWallet === null,
     'до миграции 015 карточка говорит «подключён» про браузер, а не «привязан» про аккаунт',
     txt('.gram-wallet-status') + ' · на аккаунте ' + String(w._linkedWallet));

  ok((w.__rcErrors || []).length === errBefore, 'вкладка кошелька не бросила ни одной ошибки',
     (w.__rcErrors || []).slice(errBefore).join(' | '));

  // Put the frame back the way the world checks expect to find it. The wallet
  // is disconnected through the library's own callback rather than by clearing
  // a variable, so tcAddress() and the panel agree about it afterwards.
  inject(w, `closeGramModal();
    if (window.__rcTcStatus) __rcTcStatus(null);
    window._linkedWallet = null; window._walletEverLinked = false;
    var _t2 = document.getElementById('gram-credit-toast'); if (_t2) _t2.remove();
    var _p = document.getElementById('panel-profile'); if (_p) _p.style.display = 'none';
    activeTab = 0;`);
}

function finish(w) {
  const errs = (w && w.__rcErrors) || [];
  say('');
  say(failed === 0 ? '  ' + passed + ' ПРОШЛО, 0 УПАЛО' : '  ' + passed + ' прошло, ' + failed + ' УПАЛО', failed === 0 ? 'ok' : 'bad');
  if (errs.length) { say('\nошибки внутри игры:', 'warn'); errs.forEach(e => say('  ' + e, 'bad')); }
  document.title = failed === 0 ? 'render-check OK' : 'render-check FAIL ' + failed;
}
</script>
