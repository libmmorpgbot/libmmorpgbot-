# ═══════════════════════════════════════════════════════════════════════════
#  Проверки, которые можно прогнать без боевой базы
# ═══════════════════════════════════════════════════════════════════════════
#
# ЗЕЛЁНАЯ ГАЛОЧКА ЗДЕСЬ НЕ ЗНАЧИТ «ПРОВЕРЕНО». Прогоняется только первый ярус
# dev/all-checks.sh — тот, которому из зависимостей нужен один node. База лежит
# внутри частной сети DigitalOcean и снаружи недостижима в принципе, поэтому
# два оставшихся яруса (с базой и с живым сервером) по-прежнему гоняются на
# дроплете и остаются обязательными перед выкладкой:
#
#   ssh root@178.128.136.68
#   set -a; . /srv/liberty/env; set +a
#   bash /srv/liberty/pgtest/dev/all-checks.sh
#
# Ради чего это всё равно стоит: bundle-check ловит поломку, при которой игра
# не работает ВООБЩЕ. Клиент склеивается из 25 файлов в одну область
# видимости, повторно объявленный const — это SyntaxError и чёрный экран у
# всех до единого. Такое лучше узнавать на push, а не от игроков.
#
# Вызывается именно all-checks.sh, а не свой список: у него уже есть и перечень
# проверок, и распознавание итоговой строки в пяти разных написаниях, и правило
# «проверка, которая ничего не напечатала, считается УПАВШЕЙ». Первый заход
# переписал это здесь заново, потерял один образец из пяти — и объявил
# работающую request-shape сломанной.
name: Проверки

on:
  push:
    branches: [postgres-migration]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install --no-audit --no-fund

      # DATABASE_URL намеренно не задан: без него all-checks.sh прогоняет
      # первый ярус, печатает, что группа с базой пропущена, и возвращает код
      # ровно по результатам того, что запускал.
      - name: Первый ярус — без базы и без сервера
        run: bash dev/all-checks.sh
