name: ci

# ═══════════════════════════════════════════════════════════════════════════
#  What this actually tests, and why it changed
# ═══════════════════════════════════════════════════════════════════════════
#
# It used to run `npm run lint` and `node dev/harness.js`, and nothing else.
# The harness booted `server/index.js` — the RETIRED MongoDB build. The live
# server is `server/app.js` + `server/handlers2/*` + `server/db/repos/*`
# (package.json main/start and the systemd unit both name it). So CI was green
# while exercising a build that had not run in production for weeks, and ZERO
# of the ~50 PostgreSQL detectors in dev/ ran anywhere except by hand.
#
# That is the worst shape a test suite can take: it reads as proof and proves
# nothing about the thing that ships.
#
# Now CI stands up a throwaway PostgreSQL, applies the real migrations with the
# real migrate.sh, and runs the detectors that guard the live build's
# invariants — item conservation, the double-entry ledger, market half-trades,
# the exploit fixes, enemy streaming.
#
# The Mongo harness step is gone because its subject is: server/index.js,
# server/handlers/, server/models/ and the five dev/ scripts that drove them
# were deleted whole. The test outlived the build by exactly one commit, which
# is the right order — deleting a test before deleting its subject is how a
# "temporary" build survives forever.
#
# lint: eslint against the real config (eslint.config.js) — no-undef /
# no-unused-vars are what caught the class of bug that shipped twice in one day
# (an unimported constant, a dead conditional branch).

on:
  push:
    # postgres-migration is where the live build is developed and where the
    # Mongo build was deleted; main still carries that build until this branch
    # is merged. Leaving postgres-migration off the list would mean CI never
    # ran on the branch that ships.
    branches: [main, postgres-migration]
  pull_request:
  workflow_dispatch:

jobs:
  # ── everything that needs neither a database nor a browser ────────────────
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

      # The client is 24 files concatenated into ONE script scope. A duplicate
      # top-level `let` between two of them is an early error that rejects the
      # whole script — blank page, no HUD, no login — and it has shipped. This
      # hands both the readable and the minified bundle to a real parser.
      - name: bundle parses (readable and minified)
        run: node dev/bundle-check.js

      # A dropped world packet must not cost a monster. No database, no sockets.
      - name: enemy streaming survives packet loss
        run: node dev/enemysync-check.js

      # Настоящая страница и настоящий бандл в настоящем браузере. Два дефекта,
      # которые владелец нашёл сам за полчаса — 404 на ассете и адрес кошелька
      # в сырой форме — жили в коде, который эта проверка покрывает; её просто
      # никто не запускал, потому что до сих пор она требовала человека с
      # браузером. Выход 2 означает «прогнать не удалось», а не «прошло».
      - name: страница рисуется (настоящий браузер)
        run: node dev/render-check.js --run

      - name: install psql client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # migrate.sh grants to this role on every run, so it has to exist first.
      # Deliberately NOT a superuser: the REVOKEs at the end of migrate.sh are
      # what make the ledger append-only, and a superuser would ignore them —
      # CI would then pass a test production cannot.
      - name: create the application role
        run: psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE liberty_app LOGIN PASSWORD 'ci'"

      - name: apply migrations
        run: bash server/db/migrate.sh

      # Every SQL literal in the server, PREPAREd against the schema that was
      # just built. Catches a query naming a column no migration creates —
      # including one added in the same commit and forgotten.
      - name: every query matches the schema
        run: node dev/sql-check.js

      - name: currency ledger is atomic and append-only
        run: node dev/money-check.js

      # The same proof for items. Half of it is static — it fails when a ledger
      # write is deleted from ANY path that changes an inventory, including one
      # no test thinks to call — and half is the invariant itself against the
      # database built above.
      - name: item ledger accounts for every item
        run: node dev/item-ledger-check.js

      - name: items are conserved
        run: node dev/items-check.js

      - name: a trade cannot half-happen
        run: node dev/market-check.js

      - name: enhancement cannot be got for free
        run: node dev/enhance-check.js

      - name: clan storage is conserved
        run: node dev/clans-check.js

      - name: stats cannot be forged
        run: node dev/stats-check.js

      - name: the exploits stay closed
        run: node dev/exploit-check.js

      - name: the server boots and answers
        run: node dev/boot-check.js

      # players.referred_by had no writer anywhere in this build, so the 5%
      # deposit commission, the season payout at level 20 and the invited-
      # friends list were three finished features that could not fire — and
      # nothing failed, because an empty column is a query returning no rows.
      # This one signs a real start_param and logs in with it: the bug was the
      # login throwing that field away, so a repo-only test would have been
      # green on the broken build.
      - name: an invited player gets a referrer
        run: node dev/referral-check.js
