# ═══════════════════════════════════════════════════════════════════════════
#  Проверки на настоящей базе — во временной, а не в боевой
# ═══════════════════════════════════════════════════════════════════════════
#
# ── почему этот файл до сих пор не работал ─────────────────────────────────
# Он лежал в коде и описывал ровно то, что нужно, но запустить его было негде:
# репозитория не было. Как только он впервые запустился, выяснилось, что он
# падает на первом же шаге и падал бы всегда:
#
#   npm ci      package-lock.json остался от версии на MongoDB — в нём не было
#               даже pg, драйвера самой базы. npm ci отказывается ставить, если
#               замок расходится с package.json. Замок обновлён.
#   ADMIN_URL   на него ссылались, но нигде не задавали, и базы для проверок
#               не поднималось. Теперь поднимается — здесь, ниже.
#
# ── зачем временная база, а не боевая ──────────────────────────────────────
# Отдельной тестовой базы у проекта нет: dev/all-checks.sh ходит по БОЕВОЙ и
# убирает за собой в конце. Пока работал один человек, с этим можно было жить.
# Вдвоём — уже нет: один прерванный на середине прогон оставляет мусорные
# аккаунты в рейтинге живой игры.
#
# Здесь база поднимается на время прогона и умирает вместе с ним. Испортить
# ею нечего.
#
# Роль liberty_app создаётся НАМЕРЕННО без прав суперпользователя: REVOKE в
# конце migrate.sh — это то, что делает журнал движения денег неудаляемым, а
# суперпользователь их проигнорирует. CI тогда проходил бы то, чего не
# выдерживает прод.
name: ci

on:
  push:
    branches: [main, postgres-migration]
  pull_request:
  workflow_dispatch:

jobs:
  # ── всё, чему нужна база ─────────────────────────────────────────────────
  static:
    name: база и деньги
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        # ТА ЖЕ мажорная версия, что в бою (проверено: SHOW server_version
        # на боевой отдаёт 18.6). Первый заход поднял здесь 16-ю, и sql-check
        # объявил сломанным законный запрос: RETURNING old.pending — синтаксис
        # PostgreSQL 18. Проверка на чужой версии ловит несуществующее и
        # пропускает настоящее.
        image: postgres:18
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: liberty
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      ADMIN_URL: postgres://postgres:ci@127.0.0.1:5432/liberty
      DATABASE_URL: postgres://liberty_app:ci@127.0.0.1:5432/liberty
      # Боевая база требует TLS и свой корневой сертификат, и модуль базы
      # отказывается подключаться к деньгам без него. Здесь база на этой же
      # машине и шифровать нечего — для этого случая в server/db/index.js
      # заведена именно эта лазейка, и работает она только для адреса на
      # самой машине.
      PG_ALLOW_PLAINTEXT: '1'
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # no-undef и no-unused-vars — то, что ловит класс ошибок, дважды за день
      # уехавший в прод: неимпортированная константа и мёртвая ветка условия.
      - run: npm run lint

      - name: клиент собирается (и обычный, и сжатый)
        run: node dev/bundle-check.js

      - name: потеря пакета не стоит монстра
        run: node dev/enemysync-check.js

      - name: ставлю psql
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      # migrate.sh раздаёт права этой роли на каждом прогоне, поэтому она
      # должна существовать до него.
      - name: создаю роль приложения
        run: psql "$ADMIN_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE liberty_app LOGIN PASSWORD 'ci'"

      - name: накатываю миграции
        run: bash server/db/migrate.sh

      # Каждый SQL из сервера — PREPARE против только что построенной схемы.
      # Ловит запрос к колонке, которую не создаёт ни одна миграция, включая
      # добавленную тем же коммитом и забытую.
      - name: все запросы сходятся со схемой
        run: node dev/sql-check.js

      - name: журнал денег неделим и неудаляем
        run: node dev/money-check.js

      - name: у каждого предмета есть запись в журнале
        run: node dev/item-ledger-check.js

      - name: предметы не появляются и не исчезают
        run: node dev/items-check.js

      # Письмо: две награды, одна на аккаунт. Развилку между ними решает
      # сервер по сезонному билету, и ошибка здесь беззвучна — выдача
      # работает, просто не та. Проверяется, ЧТО легло в инвентарь.
      - name: письмо выдаёт одну награду из двух, и один раз
        run: node dev/mail-check.js

      # Вход упирался в полное чтение журнала денег и валился по таймауту:
      # запрос корректен, ошибок нет, видно только планировщику и только на
      # объёме. Поэтому здесь EXPLAIN на настоящих данных.
      - name: вход не читает журнал денег целиком
        run: node dev/login-perf-check.js

      # Панель ящика обещала десять предметов, а сервер мог выдать двадцать
      # четыре: артефакты, плащи, питомцы, крылья. Ошибка беззвучная с обеих
      # сторон — выдавался законный предмет. Поэтому ящики тут открываются,
      # а не читается код.
      - name: из ящиков падает только то, что они обещают
        run: node dev/box-loot-check.js

      - name: сделка не может состояться наполовину
        run: node dev/market-check.js

      - name: заточку нельзя получить даром
        run: node dev/enhance-check.js

      - name: склад клана сходится
        run: node dev/clans-check.js

      - name: характеристики нельзя подделать
        run: node dev/stats-check.js

      - name: дыры остаются закрытыми
        run: node dev/exploit-check.js

      - name: сервер поднимается и отвечает
        run: node dev/boot-check.js

      - name: приглашённый игрок получает пригласившего
        run: node dev/referral-check.js

  # ── и то, для чего нужен настоящий браузер ───────────────────────────────
  # Отдельной задачей: браузер ставится минуту, и его поломка не должна
  # закрывать собой проверки денег. Остальные детекторы читают код или
  # спрашивают базу — ни один не видит, нарисовалось ли хоть что-то на экране.
  # Единственный раз, когда это сломалось, страница была пустой у всех, а
  # бандл при этом прекрасно разбирался: его просто никто не запускал.
  render:
    name: страница рисуется
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: настоящая страница в настоящем браузере
        run: node dev/render-check.js --run
